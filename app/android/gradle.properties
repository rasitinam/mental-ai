org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on G:\ while the Flutter/Gradle pub cache stays on
# C:\ (AppData) - Kotlin's incremental compiler tries to compute a path
# relative between the two and throws ("this and base files have
# different roots") because Windows has no relative path across drive
# letters. Incremental compilation is a build-speed optimization only;
# disabling it just means every build recompiles from scratch.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
