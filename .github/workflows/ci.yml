name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Rust backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --workspace
      - run: cargo test --workspace

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # iOS builds (and App Store submission) require Xcode, which only runs on
  # macOS. Uncomment and fill in signing details when ready to build for
  # TestFlight/App Store — see docs/ARCHITECTURE.md.
