name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Rust backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --workspace
      - run: cargo test --workspace

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Unsigned build-verification only — catches "the Android/iOS build is
  # actually broken" on every push/PR without needing any signing secrets.
  # The signed, publishable build lives in release-android.yml /
  # release-ios.yml and only runs when you trigger it — see docs/CI_CD.md.
  app-build-android:
    name: Flutter app (Android build check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # google-services.json is gitignored (it holds the Firebase project's
      # keys), and the Google Services Gradle plugin refuses to build
      # without one. This check only needs a file that parses for the app's
      # package name, so it writes a placeholder when none is present.
      - name: Placeholder Firebase config
        run: |
          [ -f android/app/google-services.json ] || cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.mentalai.mental_ai"}},
              "oauth_client": [],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
      - run: flutter build apk --debug

  app-build-ios:
    name: Flutter app (iOS build check)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign
