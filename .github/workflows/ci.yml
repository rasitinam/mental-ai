
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Rust backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --workspace
      - run: cargo test --workspace

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Build Android APK and upload it as a downloadable artifact.
  
  app-build-android:
    name: Flutter app (Android release APKs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Placeholder Firebase configuration for CI builds.
      - name: Placeholder Firebase config
        run: |
          [ -f android/app/google-services.json ] || cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.mentalai.mental_ai"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }],
            "configuration_version": "1"
          }
          JSON

      # Build optimized APKs separately for each Android architecture.
      - name: Build Android Release APKs
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://status-enticing-easeful.ngrok-free.dev

      # Upload all generated APK variants.
      - name: Upload Android Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: mental-ai-android-release
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 7


  app-build-ios:
    name: Flutter app (iOS build check)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --no-codesign
