name: Release - iOS

# Needs real Apple Developer credentials in the repo's secrets (Settings
# → Secrets and variables → Actions) — see docs/CI_CD.md for what each
# one is and how to generate it. Runs on demand or when you push a
# version tag, never on every push. Requires a macOS runner (Xcode is
# Apple-only) — see docs/ARCHITECTURE.md for why that's unavoidable even
# though the rest of this project is Windows-dev.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-upload-ios:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - name: Import signing certificate & provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # xcodebuild's automatic signing resolution checks the default
          # keychain specifically — just being on the search list (above)
          # wasn't enough for it to see the imported identity.
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Signing identities visible to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Xcode only discovers a profile here if it's named by the
          # profile's own UUID — a plain "profile.mobileprovision" is
          # silently invisible to it, which is why signing failed with
          # "No valid code signing certificates were found" even though
          # the cert imported fine above.
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Configure code signing (team ID + provisioning profile)
        # The archive step reads signing settings from the Xcode project
        # itself, not ExportOptions.plist (that only governs export) — the
        # project was left on "Automatic" signing with nothing to resolve
        # it against on a fresh runner (no signed-in Apple ID), which is
        # why the cert being in the keychain wasn't enough on its own. The
        # project now points at manual signing with placeholders here;
        # this step fills them in for both files that carry one.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/REPLACE_WITH_YOUR_APPLE_TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist
          sed -i '' "s/REPLACE_WITH_YOUR_APPLE_TEAM_ID/$APPLE_TEAM_ID/" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/REPLACE_WITH_PROVISIONING_PROFILE_UUID/$PROFILE_UUID/" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/REPLACE_WITH_PROVISIONING_PROFILE_UUID/$PROFILE_UUID/" ios/ExportOptions.plist

      - name: Build signed IPA
        run: |
          # Without API_BASE_URL the app falls back to 127.0.0.1, which on a
          # TestFlight phone means "check your internet connection" on every
          # request. The build number must also be unique per upload.
          flutter build ipa --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL=https://status-enticing-easeful.ngrok-free.dev \
            --export-options-plist=ios/ExportOptions.plist
          echo "Contents of build/ios/ipa:"
          ls -la build/ios/ipa/

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          # The secret may hold the .p8's raw PEM text (if whoever set it
          # pasted the key straight from Apple's download instead of
          # base64-encoding it first) or the base64 of it, as documented
          # in docs/CI_CD.md — handle either so a format mismatch here
          # doesn't surface three steps later as an opaque altool error.
          if [[ "$APP_STORE_CONNECT_API_KEY_BASE64" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" > "$KEY_PATH"
          else
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          fi

          echo "API key file: $(wc -c < "$KEY_PATH") bytes, starts with:"
          head -1 "$KEY_PATH"

          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
