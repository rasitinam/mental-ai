[server]
# 0.0.0.0 so phones/other devices on the same local network (e.g. the
# Flutter app running on an Android device connected over Wi-Fi) can
# reach it too, not just this machine. Every route except /health and
# /insights (GET) requires a bearer token, but this does mean anyone on
# the same network can attempt to hit /auth/login or /auth/register -
# fine on a trusted home network, not on public Wi-Fi.
host = "0.0.0.0"
port = 8787

[database]
url = "sqlite://data/mental_ai.db?mode=rwc"

[llm]
# "openai-compatible" works against OpenAI itself, Azure OpenAI, or any
# self-hosted endpoint that speaks the OpenAI Chat Completions schema.
provider = "openai-compatible"
base_url = "https://api.openai.com/v1"
chat_model = "gpt-5.6-terra"
embedding_model = "text-embedding-3-large"
# Name of the environment variable holding the API key. Never put the key
# itself in this file.
api_key_env = "MENTAL_AI_LLM_API_KEY"

[research_ingest]
enabled = true
interval_hours = 6
sources = [
    "pubmed_general",
    "pubmed_ptsd",
    "pubmed_bipolar",
    "pubmed_anxiety_depression",
    "pubmed_borderline",
    "pubmed_ocd",
    "pubmed_schizophrenia",
    "pubmed_recovery",
]

[apple_iap]
bundle_id = "com.rasitinam.hearth"
# Name of the environment variable holding the App-Specific Shared Secret
# (App Store Connect -> Hearth -> Subscriptions -> App-Specific Shared
# Secret). Never put the secret itself in this file.
shared_secret_env = "MENTAL_AI_APPLE_SHARED_SECRET"
