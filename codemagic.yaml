definitions:
  # Reused so the version bump only has to be typed in one place.
  ios_build_defaults: &ios_build_defaults
    flutter: stable
    xcode: latest
    cocoapods: default

workflows:
  # Builds the iOS app in Codemagic's cloud (a real Mac, no local Xcode
  # needed) and uploads it to App Store Connect. Wire this up once:
  #
  # 1. In Codemagic, add your repo (github.com/rasitinam/mental-ai).
  # 2. Codemagic > Teams > Integrations > Apple Developer Portal: add an
  #    App Store Connect API key (App Store Connect > Users and Access >
  #    Integrations > App Store Connect API > generate one with "App
  #    Manager" access). Name the integration exactly `hearth_app_store`
  #    to match `integrations.app_store_connect` below, or change both.
  # 3. Codemagic > this workflow > Environment variables: set
  #    `API_BASE_URL` to your *deployed, publicly reachable* backend URL
  #    — not a home-network LAN address, which only your own devices on
  #    that Wi-Fi can reach. A build made with a LAN address will look
  #    fine locally and simply never load any data for anyone else.
  # 4. In ios/ExportOptions.plist, replace REPLACE_WITH_YOUR_APPLE_TEAM_ID
  #    with your real Apple Developer Team ID (Apple Developer portal >
  #    Membership).
  # 5. Push to `main` (or trigger the build manually from Codemagic) —
  #    it builds, signs, and submits to TestFlight automatically.
  ios-release:
    name: Hearth iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      <<: *ios_build_defaults
      vars:
        BUNDLE_ID: "com.rasitinam.hearth"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        # Set the real value in Codemagic's UI (step 3 above) rather than
        # here — this file is committed, a real backend URL isn't secret,
        # but keeping infra config in one place (the Codemagic dashboard)
        # beats splitting it between here and there.
        API_BASE_URL: "$API_BASE_URL"
    integrations:
      app_store_connect: hearth_app_store
    working_directory: app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Flutter dependencies
        script: flutter packages pub get
      - name: Set up code signing (automatic, via the App Store Connect API key)
        script: |
          xcode-project use-profiles
      - name: Bump build number to the Codemagic build number
        script: |
          cd ios && agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads straight to TestFlight; flip to `true` once you're
        # ready to also submit the build for App Store review from here.
        submit_to_testflight: true
        submit_to_app_store: false
